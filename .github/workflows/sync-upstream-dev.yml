name: Sync upstream dev

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: sync-upstream-dev

jobs:
  sync:
    if: github.repository == 'JakobM7/opencodexSessionInspector'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      FORK: ${{ github.repository }}
      UPSTREAM: lidge-jun/opencodex
    steps:
      - name: Sync dev from upstream
        shell: bash
        run: |
          upstream_sha=$(gh api "repos/$UPSTREAM/git/ref/heads/dev" --jq '.object.sha')
          fork_sha=$(gh api "repos/$FORK/git/matching-refs/heads/dev" \
            --jq '.[] | select(.ref == "refs/heads/dev") | .object.sha')

          if [[ -z "$fork_sha" ]]; then
            gh api --method POST "repos/$FORK/git/refs" \
              -f ref=refs/heads/dev -f sha="$upstream_sha" --jq .object.sha
          elif [[ "$fork_sha" != "$upstream_sha" ]]; then
            ancestry=$(gh api "repos/$FORK/compare/$fork_sha...$upstream_sha" --jq .status)
            if [[ "$ancestry" != "ahead" ]]; then
              echo "::error::Fork dev cannot fast-forward to upstream dev ($ancestry)."
              exit 1
            fi
          fi

          gh api --method POST "repos/$FORK/merge-upstream" -f branch=dev --jq .message
